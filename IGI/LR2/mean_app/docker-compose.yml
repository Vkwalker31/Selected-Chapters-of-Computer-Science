version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: mean_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secure_password_123
      MONGO_INITDB_DATABASE: meanapp
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - mean-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongo:27017/test
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: mean_mongo_express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secure_password_123
      ME_CONFIG_MONGODB_URL: mongodb://admin:secure_password_123@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: me_admin
      ME_CONFIG_BASICAUTH_PASSWORD: me_password_456
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    networks:
      - mean-network

  backend:
    build: ./server
    container_name: mean_backend
    restart: always
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:secure_password_123@mongo:27017/meanapp
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    networks:
      - mean-network
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build: ./client
    container_name: mean_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mean-network

networks:
  mean-network:
    driver: bridge
    name: mean_app_network

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
