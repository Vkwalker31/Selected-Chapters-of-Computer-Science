version: '3.8'

services:
  web:
    build: .
    image: museumapp_web:latest
    container_name: museumapp_web
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=0
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DATABASE_PATH=/app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data
    command: >
      sh -c "python manage.py migrate --noinput
      && gunicorn MuseumApp.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2"

volumes:
  sqlite_data:
